name: Deploy Nouroul Foua'ad to Cloudflare Workers
# Production deployment workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build
        env:
          SUPABASE_URL: https://okdohokhlkxrmxpevees.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_fUXEGWcnnu_BmQIKV6Rc9w_-_1xbQ67
          VITE_SUPABASE_URL: https://okdohokhlkxrmxpevees.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fUXEGWcnnu_BmQIKV6Rc9w_-_1xbQ67

      - name: Verify Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
